SOLVER= EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= YES

MACH_NUMBER= 0.8000
AOA= 3.700
SIDESLIP_ANGLE= 0.0
FREESTREAM_TEMPERATURE= 216.65
FREESTREAM_PRESSURE= 17872.0
FREESTREAM_OPTION= TEMPERATURE_FS

REF_ORIGIN_MOMENT_X= 0.0
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 1.53119
REF_AREA= 8.99664

MARKER_EULER= ( wing_wall )
MARKER_SYM= ( symmetry )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( wing_wall )
MARKER_MONITORING= ( wing_wall )

% -- numerics: JST for fast initial convergence (cfdinstructions.md); smooth
% limiter to avoid limit-cycle oscillation near shocks
NUM_METHOD_GRAD= GREEN_GAUSS
CONV_NUM_METHOD_FLOW= JST
MUSCL_FLOW= NO
JST_SENSOR_COEFF= ( 0.5, 0.02 )
TIME_DISCRE_FLOW= EULER_IMPLICIT

% -- CFL ramping: conservative start, adapt up as the solve settles
CFL_NUMBER= 5.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.2, 1.0, 100.0 )

LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-2
LINEAR_SOLVER_ITER= 10

% -- mesh sequencing / multigrid (cfdinstructions.md sec.5)
MGLEVEL= 2
MGCYCLE= V_CYCLE
MG_PRE_SMOOTH= ( 1, 2, 1 )
MG_POST_SMOOTH= ( 0, 0, 0 )

ITER= 2500
CONV_FIELD= DRAG
CONV_RESIDUAL_MINVAL= -10
CONV_STARTITER= 50
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-5

MESH_FILENAME= coarse_euler2.su2
MESH_FORMAT= SU2
TABULAR_FORMAT= CSV
CONV_FILENAME= history_design_M080
SOLUTION_FILENAME= restart_sanity_M080.dat
RESTART_FILENAME= restart_design_M080.dat
OUTPUT_FILES= ( RESTART, SURFACE_CSV, PARAVIEW )
SURFACE_FILENAME= surface_design_M080
VOLUME_FILENAME= volume_design_M080
OUTPUT_WRT_FREQ= 200
SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY, RMS_ENERGY, LIFT, DRAG, MOMENT_Z )
SCREEN_WRT_FREQ_INNER= 25
